id = "alivop.devtoolbox"
name = "Developer Toolbox"
version = "0.1.0"
description = "Twelve everyday developer tools in a right-side tool window: timestamp converter, password generator, JSON formatter, ID generator (UUID v4/v7, NanoID, Snowflake, ObjectId), Base64, URL and Unicode codecs, JWT parse/sign/verify (HS256/384/512), Cron expression preview, regex tester with match highlighting and replace, AES/SM4/DES/3DES/RC4 encryption and decryption (CBC/ECB/CTR/GCM) plus XOR and classical ciphers, and MD5/SHA hashes. Everything runs locally inside the sandboxed view — no network, no telemetry.\nOpen: right toolbar → Developer Toolbox.\n中文：右侧工具窗里的十二个日常开发小工具：时间戳转换、密码生成器、JSON 格式化、ID 生成（UUID v4/v7、NanoID、Snowflake、ObjectId）、Base64、URL 与 Unicode 编解码、JWT 解析/签名/验签（HS256/384/512）、Cron 表达式预览、正则测试（匹配高亮与替换）、AES/SM4/DES/3DES/RC4 加解密（CBC/ECB/CTR/GCM）与 XOR、古典密码、MD5/SHA 哈希。全部在沙箱视图内本地运行——不联网、无遥测。\n打开方式：右侧工具栏 → 开发者工具箱。"
authors = ["Alivop"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: twelve local tools in a right-side tool window. Pure web view (no WebAssembly); the sandbox blocks all network access.\n\n中文：0.1.0 首次发布：右侧工具窗内的十二个本地小工具。纯 web 视图（无 WebAssembly）；沙箱禁止一切网络访问。"
categories = ["tools"]
icon = "icons/toolbox.svg"
icon-dark = "icons/toolbox_dark.svg"
engines.openidea = "^1.2"

[capabilities]
required = ["clipboard"]

[[contributes.views]]
id = "toolbox"
title = "Developer Toolbox"
icon = "icons/toolbox.svg"
location = "right"
web = "web/index.html"